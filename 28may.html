<!DOCTYPE html>
<html>
<head>
<style>
.container {
    position: relative;
    width: 600px;
    height: 500px;
    border: 2px solid black;
}

.box {
    width: 120px;
    height: 120px;
    position: absolute;
    opacity: 0.8;
}
/* Second stack moved right */
.box6 {
    background: red;
    top: 20px;
    left: 320px;
    z-index: 6;
}

.box7 {
    background: blue;
    top: 60px;
    left: 360px;
    z-index: 7;
}

.box8 {
    background: green;
    top: 100px;
    left: 400px;
    z-index: 8;
}

.box9 {
    background: orange;
    top: 140px;
    left: 440px;
    z-index: 9;
}

.box10 {
    background: purple;
    top: 180px;
    left: 480px;
    z-index: 10;
}
/* Reverse stacking order */
.box1 {
    background: rgb(208, 0, 255);
    top: 20px;
    left: 20px;
    z-index: 5;
}

.box2 {
    background: rgb(0, 255, 128);
    top: 60px;
    left: 60px;
    z-index: 4;
}

.box3 {
    background: rgb(0, 68, 128);
    top: 100px;
    left: 100px;
    z-index: 3;
}

.box4 {
    background: rgb(127, 107, 70);
    top: 140px;
    left: 140px;
    z-index: 2;
}

.box5 {
    background: rgb(0, 128, 128);
    top: 180px;
    left: 180px;
    z-index: 1;
}
</style>
</head>

<body>

<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>



    <div class="box box6"></div>
    <div class="box box7"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>
    <div class="box box10"></div>
</div>

</body>
</html>
