<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f3f6;
    }

    /* Navbar */
    .navbar{
      background:#2874f0;
      color:white;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 40px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
    }

    .search-box{
      width:45%;
    }

    .search-box input{
      width:100%;
      padding:10px;
      border:none;
      border-radius:4px;
    }

    .nav-links{
      display:flex;
      gap:20px;
      font-size:18px;
    }

    /* Banner */
    .banner{
      background:url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200') center/cover;
      height:300px;
      margin:20px;
      border-radius:10px;
    }

    /* Products */
    .products{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
      padding:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:8px;
    }

    .card h3{
      margin:10px 0;
    }

    .price{
      color:green;
      font-weight:bold;
      font-size:18px;
    }

    button{
      margin-top:10px;
      padding:10px 15px;
      border:none;
      background:#2874f0;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#0b5ed7;
    }

    /* Footer */
    footer{
      background:#172337;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:30px;
    }

    @media(max-width:900px){
      .products{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .navbar{
        flex-direction:column;
        gap:10px;
      }

      .search-box{
        width:100%;
      }

      .products{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Flipkart</div>

    <div class="search-box">
      <input type="text" placeholder="Search for products">
    </div>

    <div class="nav-links">
      <div>Login</div>
      <div>Cart</div>
      <div>Become a Seller</div>
    </div>
  </div>

  <!-- Banner -->
  <div class="banner"></div>

  <!-- Product Section -->
  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800" alt="">
      <h3>iPhone</h3>
      <p class="price">₹79,999</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=800" alt="">
      <h3>Camera</h3>
      <p class="price">₹45,000</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=800" alt="">
      <h3>Headphones</h3>
      <p class="price">₹2,999</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800" alt="">
      <h3>Shoes</h3>
      <p class="price">₹1,999</p>
      <button>Buy Now</button>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    © 2026 Flipkart Clone | Made with HTML & CSS
  </footer>

</body>
</html>
