<!DOCTYPE html>
<html lang="en">
<head>
<style>

body{
    background:#f0f2f5;
    font-family:Arial;
}

.container{
    width:500px;
    height:1000px;
    margin:30px auto;
    background:rgb(224, 217, 217);
    border-radius:10px;
    overflow:hidden;
}

.bluebox{
    width:500px;
    height:250px;
    background-color:blue;
    position:relative;
}

.pfp{
    width:180px;
    height:180px;
    border-radius:50%;
    border:5px solid white;
    overflow:hidden;
    position:absolute;
    bottom:-70px;
    left:150px;
    background:white;
}

.pfp img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.text{
    text-align:center;
    position:relative;
    bottom:-80px;
}

.media{
    text-align:center;
    margin-top:120px;
}

.media img{
    width:220px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
}
.socials{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.socials img{
    width:40px;
    height:40px;
    object-fit:cover;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

    <div class="bluebox">

        <div class="pfp">
            <img src="https://th.bing.com/th?id=ONUT.qHe0wMC15u_fDz7CIHodbQ&pid=News&w=316&h=200&c=14&rs=2&qlt=90&dpr=1.3">
        </div>

    </div>

    <div class="text">
        <h2>Soumyadeep Das</h2>
        <h4>Student</h4>
    </div>

    <div class="media">
       <div class="socials">

    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">

    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">

    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png">

</div>
    </div>

</div>

</body>
</html>
